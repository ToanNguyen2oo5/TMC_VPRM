<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sealBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="50%" stop-color="#801b1b"/>
      <stop offset="100%" stop-color="#3d0a0a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8c6200"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular lacquer seal background -->
  <circle cx="32" cy="32" r="30" fill="url(#sealBg)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 1.5"/>

  <!-- Vietnamese Lapel / Giao Lĩnh collar lines -->
  <path d="M 20 18 L 32 36 L 44 18" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 24 16 L 32 30 L 40 16" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Stylized Lotus Blossom in center -->
  <!-- Center Petal -->
  <path d="M 32 23 C 28 29 28 39 32 44 C 36 39 36 29 32 23 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Left Petal -->
  <path d="M 32 33 C 25 31 19 36 20 42 C 24 45 29 42 32 39 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <!-- Right Petal -->
  <path d="M 32 33 C 39 31 45 36 44 42 C 40 45 35 42 32 39 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Base lotus leaves / water waves -->
  <path d="M 23 45 Q 32 49 41 45 Q 32 47 23 45 Z" fill="url(#goldGrad)"/>
  <!-- Little Imperial jewels / stars -->
  <circle cx="32" cy="14" r="1.5" fill="url(#goldGrad)"/>
</svg>
